name: CI

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      APP_ENV: test
      MERCADOPAGO_MODE: test
      LYSTO_E2E_PRODUCTION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8; verified upstream tag
        with:
          version: 9.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Source and release inventory
        run: node scripts/record-ci-inventory.mjs
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high --json > output/ci/dependency-audit.json
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Domain tests
        run: pnpm test:domain | tee output/ci/domain.log
      - name: Test runner safety
        run: pnpm test:tooling | tee output/ci/tooling.log
      - name: Unit tests
        run: |
          pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=output/ci/unit.json
          node scripts/check-unit-evidence.mjs
      - name: Vendor and image runtime
        run: |
          pnpm verify:payments | tee output/ci/payment-runtime.log
          pnpm verify:images | tee output/ci/image-runtime.log
      - name: Prepare isolated Supabase project
        id: database-project
        run: node scripts/prepare-ci-database.mjs "$RUNNER_TEMP/lysto-integration-ci"
      - name: Start clean local Supabase
        run: pnpm exec supabase start --workdir "$RUNNER_TEMP/lysto-integration-ci" > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - name: Database permissions and schema tests
        run: pnpm exec supabase test db --local --workdir "$RUNNER_TEMP/lysto-integration-ci" | tee output/ci/database-tests.log
      - name: Database lint and generated types
        run: |
          pnpm exec supabase db lint --local --schema public,private,invitation_gateway --fail-on error --workdir "$RUNNER_TEMP/lysto-integration-ci" | tee output/ci/database-lint.log
          node scripts/verify-ci-schema.mjs "$RUNNER_TEMP/lysto-integration-ci"
      - name: Install E2E browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Mandatory Auth and payment integration; zero skipped
        run: pnpm test:integration -- --local-workdir "$RUNNER_TEMP/lysto-integration-ci" | tee output/ci/integration.log
      - name: Production build and E2E with disposable backend; zero skipped
        run: node scripts/test-e2e-ci.mjs "$RUNNER_TEMP/lysto-integration-ci"
      - name: Verify incomplete release manifest is blocked
        run: node scripts/check-release-evidence.mjs --self-test-blocking
      - name: Collect evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ github.sha }}-evidence
          path: |
            output/ci
            output/integration
            test-results
            playwright-report
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Stop only disposable CI stack
        if: always() && steps.database-project.outcome == 'success'
        run: pnpm exec supabase stop --workdir "$RUNNER_TEMP/lysto-integration-ci" --no-backup

  domain-windows:
    name: Domain tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:domain

  deploy-production:
    name: Publish main to lystohogar.com
    needs: [quality, domain-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: lysto-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_jS4gRIVTCEYyCNBjbGLeflWY
      VERCEL_PROJECT_ID: prj_nggGpeRYxmcrXDni6Xt98OWwVJg7
    steps:
      - name: Checkout the tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4
      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Configure the production VERCEL_TOKEN secret for this project.'; exit 1; }
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
