<!doctype html>
<html lang="es"><body><h1>Cambiar tu correo en Lysto</h1>
<p>Recibiste este mensaje porque se solicitó un cambio de correo. Para completarlo, confirmá los enlaces enviados al correo actual y al nuevo.</p>
<p><a href="{{ .SiteURL }}/auth/change-email?token_hash={{ .TokenHash }}">Revisar y confirmar el cambio</a></p>
<p>Si no solicitaste este cambio, no confirmes el enlace y revisá la seguridad de tu cuenta.</p>
</body></html>
